# Nightly encrypted database backup, kept as a workflow artifact for 30 days.
#
# Setup (Settings → Secrets and variables → Actions → Secrets):
#   MONGO_URI          your MongoDB Atlas connection string
#   BACKUP_PASSPHRASE  a long random passphrase (keep a copy somewhere safe —
#                      without it the backups cannot be opened)
#
# The file is AES-256 encrypted before upload. Artifacts on a public repository
# can be downloaded by other GitHub users, so the passphrase is what protects it.
# Restore: download the artifact, unzip, then
#   MONGO_URI=... BACKUP_PASSPHRASE=... npm --prefix server run restore -- <file> --dry-run
name: Backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:30 in Dhaka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$MONGO_URI" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::MONGO_URI or BACKUP_PASSPHRASE secret is not set — skipping backup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --omit=dev
        if: steps.check.outputs.ready == 'true'
        working-directory: server
      - name: Create encrypted backup
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          JWT_ACCESS_SECRET: backup-job-does-not-sign-tokens-0000000000
        run: node scripts/backup.js ../backup/bachelormate-${{ github.run_id }}.bmbak
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.bmbak
          retention-days: 30
          if-no-files-found: error
