<!doctype html>
<html lang="en" data-theme="light" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BachelorMate — manage meals, expenses and chat for your shared home." />
    <meta name="theme-color" content="#7c3aed" />
    <title>BachelorMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem("bm_theme") || "{}");
        var mode = t.mode || "system";
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.dataset.theme = dark ? "dark" : "light";
        el.dataset.accent = t.accent || "violet";
        el.dataset.preset = t.preset || "default";
        el.dataset.density = t.density || "comfortable";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
