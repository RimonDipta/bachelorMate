# Pings the live app every 10 minutes. This keeps Render's free instance
# awake (it sleeps after 15 idle minutes) and, if the app is down, the run
# fails and GitHub emails you. Set the repository variable APP_URL
# (Settings → Secrets and variables → Actions → Variables), e.g.
# https://bachelormate.onrender.com
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Check /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # A sleeping instance can take ~a minute to wake, so allow retries.
          curl --fail --silent --show-error --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${APP_URL%/}/api/health" | tee health.json
          grep -q '"db":"up"' health.json || { echo "::error::Database is not connected"; exit 1; }
