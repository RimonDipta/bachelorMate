# Render Blueprint: deploys BachelorMate as ONE web service.
# The Node API serves the built React app, so the frontend, REST API and
# WebSockets share one URL (no CORS or third-party-cookie problems).
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: bachelormate
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: CLIENT_URL
        sync: false # e.g. https://bachelormate.onrender.com
      - key: CORS_ORIGINS
        sync: false # same as CLIENT_URL
      - key: SEED_DEMO
        value: "true" # loads the demo home once; set to false to disable
      - key: BREVO_API_KEY
        sync: false # brevo.com → SMTP & API → API keys. Works without a domain (leave empty if using Resend/SMTP)
      - key: MAIL_FROM
        sync: false # e.g. BachelorMate <you@gmail.com> — must be a sender verified in Brevo
      - key: FEEDBACK_EMAIL
        sync: false # optional: your email, to receive "Send feedback" messages from testers
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: REVIEW_MIN_STAY_DAYS
        value: "7"
      # Optional extras (all free):
      - key: VAPID_PUBLIC_KEY
        sync: false # push notifications: run `npx web-push generate-vapid-keys` once
      - key: VAPID_PRIVATE_KEY
        sync: false # keep secret; changing it signs everyone's devices out of push
      - key: SENTRY_DSN
        sync: false # sentry.io free plan; leave empty to only log errors
      # Optional: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS (instead of Resend), FIREBASE_PROJECT_ID
